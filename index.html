<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <!-- 바깥 주소는 모두 막는다. script의 'unsafe-inline'은 Capacitor 연결 스크립트용(앱으로 감쌀 때) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>영어로 키우는 한국사</title>
  <!-- 아이패드 '홈 화면에 추가'용 -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="영어 한국사">
  <meta name="theme-color" content="#F7ECDF">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"></div>
  <script src="vendor/capacitor.js"></script>
  <script src="vendor/preferences.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
